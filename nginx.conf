server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Privacy: do not log visitor IP addresses or browsed article URLs to disk/stdout.
    access_log off;
    add_header Referrer-Policy "same-origin" always;

    # Proxy API calls to the Spring backend so the app works when accessed directly on this port
    # (docker-compose maps host:4200 → this container:80; without this block, nginx returns 405
    # for every POST because try_files can't handle non-GET requests).
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }

    # Dynamic XML sitemap generated by the Spring backend from WikiService + static routes.
    location = /sitemap.xml {
        proxy_pass         http://backend:8080/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Social media link-preview bots, AI search crawlers, and non-JS search engines get
    # full semantic HTML rendered by the backend; browsers and Googlebot/bingbot receive the Angular SPA.
    location ~ ^/wiki/(.+)$ {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|TelegramBot|Viber|LinkedInBot|Discordbot|WhatsApp|Slackbot|GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|PerplexityBot|DuckDuckBot|YandexBot|Applebot)") {
            rewrite ^/wiki/(.+)$ /api/wiki/seo/$1 break;
            proxy_pass http://backend:8080;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA: route everything to index.html so Angular's router handles it. Also serves the non-hashed
    # root files (favicon.ico, logo-icon.*, hero-bg-art.webp, robots.txt): revalidate them on every
    # load so a replaced image shows up after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Never cache the SPA shell. A deploy ships new hashed asset names; a cached index.html would
    # keep pointing browsers at asset URLs that no longer exist (white screen until hard-refresh).
    # Revalidate on every load — it's tiny, and it lets the immutable assets below be cached forever.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "same-origin" always;
    }

    # Non-hashed files under /assets/ (translations, images) keep the same URL across deploys.
    # Without an explicit header browsers cache them heuristically for days, so a deploy's new
    # el.json was ignored (raw HOME.HERO.* keys on screen). no-cache = keep a copy but revalidate
    # on every load (a cheap 304 via ETag). ^~ stops the regex location below from matching here.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Cache content-hashed build output forever: main-/chunk-/styles-XXXXXXXX.js|css and the
    # fontsource files in media/ (e.g. roboto-greek-400-normal-ABCD1234.woff2). A new build gets new
    # names, so a stale copy can never be served. Only names carrying the hash may match here.
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "same-origin" always;
    }
}
